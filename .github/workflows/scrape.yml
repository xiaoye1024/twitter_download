name: 推特帖子批量抓取

on:
  workflow_dispatch:
    inputs:
      target_users:
        description: '目标用户（多个用逗号分隔）'
        required: true
        default: 'cu9774845768448'
      max_tweets:
        description: '每个用户最多抓取条数'
        required: false
        default: '100'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install twikit aiohttp aiofiles

      - name: 准备配置文件
        run: cp config.example.json config.json

      - name: 运行抓取脚本
        env:
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TARGET_USERS: ${{ github.event.inputs.target_users }}
          MAX_TWEETS: ${{ github.event.inputs.max_tweets }}
        run: python twitter_scraper.py

      - name: 上传结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twitter-data
          path: |
            output/
            media/
          retention-days: 7
